[project]
name = "brain-explorer"
version = "0.1.0"
description = "Explore Antigravity session trajectories and skill activations using the Google Antigravity SDK and Textual."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2ui-agent-sdk>=0.12.0",
    "a2ui-core>=0.7.0",
    "google-antigravity",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "textual>=0.80.0",
]

[project.scripts]
brain-explorer = "brain_explorer.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_explorer"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["google.antigravity", "google.antigravity.*", "a2ui", "a2ui.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"


