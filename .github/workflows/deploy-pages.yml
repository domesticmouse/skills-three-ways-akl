name: Deploy Codelab & Slidev to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'codelab/**'
      - 'slides/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: slides
        run: npm ci

      - name: Build codelab
        working-directory: slides
        run: npm run build:codelab

      - name: Build slides
        working-directory: slides
        run: npm run build

      - name: Assemble GitHub Pages bundle
        run: |
          rm -rf _site
          mkdir -p _site/slides
          cp -R codelab/dist/* _site/
          cp -R slides/dist/* _site/slides/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
